{% extends "base.html" %}
{% block titulo %}Iniciar sesión · Inventario{% endblock %}
{% block contenido %}
  <h2>Iniciar sesión</h2>
  <form method="post" class="formulario">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="correo">Correo</label>
    <input id="correo" name="correo" type="email" value="{{ correo }}" required maxlength="150" autocomplete="username">
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password">
    <div class="botones"><button class="boton" type="submit">Ingresar</button></div>
  </form>
{% endblock %}
